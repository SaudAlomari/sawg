<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAWG | ألغاز ومسابقات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a href="#play" class="brand">SAWG<span>ألغاز</span></a>
    <nav id="nav" hidden>
      <a href="#play">العب</a>
      <a href="#submit">أضف لغزًا</a>
      <a href="#admin" id="nav-admin" lang="en" hidden>Admin</a>
      <span class="muted small" id="whoami"></span>
      <button id="signout" class="link">تسجيل الخروج</button>
    </nav>
  </header>

  <main id="app"><p class="center muted">جارٍ التحميل…</p></main>

  <!-- ===== Templates ===== -->

  <template id="t-auth">
    <section class="card narrow">
      <div class="tabs">
        <button data-tab="signin" class="active">تسجيل الدخول</button>
        <button data-tab="signup">حساب جديد</button>
      </div>
      <form id="auth-form">
        <label>اسم المستخدم <input name="username" autocomplete="username" autocapitalize="off" dir="ltr" required></label>
        <label class="signup-name" hidden>الاسم الظاهر <input name="displayName" maxlength="40" placeholder="الاسم الذي يراه الآخرون"></label>
        <label>كلمة المرور <input name="password" type="password" dir="ltr" autocomplete="current-password" required minlength="6"></label>
        <div class="first-only" dir="ltr" lang="en" hidden>
          <p class="hint">👑 You're the first one here, so you'll be the <b>admin</b>. To let the site save players and puzzles into your GitHub repo, paste a GitHub key once.</p>
          <label>GitHub key <input name="token" type="password" autocomplete="off" placeholder="github_pat_…"></label>
          <details class="small">
            <summary>How do I get a GitHub key?</summary>
            <ol class="small key-steps"></ol>
          </details>
        </div>
        <p class="error" hidden></p>
        <button type="submit" class="primary">تسجيل الدخول</button>
      </form>
      <p class="muted small signup-only" hidden>بعد التسجيل ستحصل على رمز ترسله إلى المشرف، وتستطيع اللعب بعد أن يفعّل حسابك.</p>
    </section>
  </template>

  <template id="t-code">
    <section class="card narrow">
      <h2 id="c-title"></h2>
      <p id="c-text"></p>
      <textarea id="c-code" rows="5" dir="ltr" readonly></textarea>
      <div id="c-buttons"></div>
      <p class="muted small" id="c-after"></p>
      <button class="link" id="c-back"></button>
    </section>
  </template>

  <template id="t-play">
    <section class="card">
      <div class="progress"><span id="p-count"></span><div class="bar"><div id="p-bar"></div></div></div>
      <div id="puzzle">
        <p class="muted small" id="p-author"></p>
        <h2 id="p-question"></h2>
        <img id="p-image" alt="صورة اللغز" hidden>
        <form id="answer-form">
          <div id="p-options" class="options"></div>
          <input id="p-text" name="answer" placeholder="إجابتك" autocomplete="off" hidden>
          <p id="p-feedback" class="feedback" hidden></p>
          <div class="row">
            <button type="submit" class="primary" id="p-submit">تحقق من الإجابة</button>
            <button type="button" id="p-hint" hidden>أظهر التلميح</button>
            <button type="button" id="p-skip" class="link">تخطَّ</button>
          </div>
          <p id="p-hint-text" class="hint" hidden></p>
        </form>
        <button class="primary" id="p-next" hidden>اللغز التالي ←</button>
      </div>
      <div id="done" class="center" hidden>
        <h2>🎉 أنهيت كل الألغاز!</h2>
        <p id="done-score"></p>
        <p>تظهر الألغاز الجديدة هنا بعد موافقة المشرف. لماذا لا <a href="#submit">تضيف لغزًا</a>؟</p>
        <button class="link" id="restart">ابدأ من جديد من اللغز الأول</button>
      </div>
    </section>
    <p class="muted small center">يُحفظ تقدمك على هذا الجهاز.</p>
  </template>

  <template id="t-submit">
    <section class="card">
      <h2>أضف لغزًا</h2>
      <p class="muted small">املأ النموذج لتحصل على رمز ترسله إلى المشرف. سيظهر لغزك في اللعبة بعد الموافقة عليه.</p>
      <form id="submit-form">
        <label>السؤال <textarea name="question" rows="3" required maxlength="1000"></textarea></label>
        <fieldset>
          <legend>نوع الإجابة</legend>
          <label class="inline"><input type="radio" name="type" value="text" checked> إجابة مكتوبة</label>
          <label class="inline"><input type="radio" name="type" value="choice"> اختيار من متعدد</label>
        </fieldset>
        <div id="s-options" hidden>
          <label>الخيارات (خيار في كل سطر، من ٢ إلى ٦) <textarea name="options" rows="4" placeholder="الخيار الأول&#10;الخيار الثاني&#10;الخيار الثالث"></textarea></label>
        </div>
        <label>الإجابة الصحيحة <input name="answers" required placeholder="مثال: الرياض"></label>
        <p class="muted small">لقبول أكثر من صيغة للإجابة المكتوبة، افصل بينها بالعلامة |<br>مثال: <b>كيبورد | لوحة المفاتيح</b><br>لا يهم الفرق بين (أ) و(ا)، ولا بين (ة) و(ه).</p>
        <label>تلميح (اختياري) <input name="hint" maxlength="300"></label>
        <label class="inline"><input type="checkbox" name="hasImage"> لغزي فيه صورة (أرسلها إلى المشرف مع الرمز)</label>
        <p class="error" hidden></p>
        <button type="submit" class="primary">احصل على رمز اللغز</button>
      </form>
    </section>
  </template>

  <template id="t-admin-key">
    <section class="card narrow" dir="ltr" lang="en">
      <h2>Connect to GitHub</h2>
      <p>To save players and puzzles from this device, paste your GitHub key. It's saved only on this device.</p>
      <ol class="small key-steps"></ol>
      <form id="key-form">
        <label>GitHub key <input name="token" type="password" autocomplete="off" required placeholder="github_pat_…"></label>
        <p class="error" hidden></p>
        <button class="primary" type="submit">Save key</button>
      </form>
    </section>
  </template>

  <template id="t-admin">
    <section class="card" dir="ltr" lang="en">
      <h2>Paste a code</h2>
      <p class="muted small">Players send you a sign-up code or a puzzle code. Paste it here.</p>
      <textarea id="code" rows="4" placeholder="SAWG-USER-… or SAWG-PUZZLE-…"></textarea>
      <p class="error" id="code-error" hidden></p>
      <div id="preview"></div>
    </section>
    <section class="card" dir="ltr" lang="en">
      <div class="tabs">
        <button data-admin-tab="users" class="active">Users</button>
        <button data-admin-tab="puzzles">Puzzles</button>
      </div>
      <p class="success" id="saved" hidden></p>
      <ul id="a-users" class="list"></ul>
      <ul id="a-puzzles" class="list" hidden></ul>
      <p class="muted small">Changes show on the site about a minute after saving.</p>
      <button id="forget" class="link">Remove GitHub key from this device</button>
    </section>
  </template>

  <script src="common.js"></script>
  <script src="admin.js"></script>
  <script src="app.js"></script>
</body>
</html>
