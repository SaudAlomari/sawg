<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ألغاز العيلة الحبيبة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="style.css?v=27">
</head>
<body>
  <header class="top">
    <a href="#play" class="brand">ألغاز العيلة الحبيبة</a>
    <nav id="nav" hidden>
      <a href="#play">العب</a>
      <a href="#submit">أضف لغزًا</a>
      <a href="#leaderboard">المتصدرون</a>
      <a href="#admin" id="nav-admin" lang="en" hidden>Admin</a>
      <a href="#profile" id="whoami" title="ملفي"></a>
      <button id="signout" class="link">تسجيل الخروج</button>
    </nav>
  </header>

  <main id="app"><p class="center muted">جارٍ التحميل…</p></main>

  <!-- ===== Templates ===== -->

  <template id="t-auth">
    <section class="card narrow">
      <div class="tabs">
        <button data-tab="signin" class="active">تسجيل الدخول</button>
        <button data-tab="signup">حساب جديد</button>
      </div>
      <form id="auth-form">
        <label>اسم المستخدم <input name="username" autocomplete="username" autocapitalize="off" dir="ltr" required></label>
        <label>كلمة المرور <input name="password" type="password" dir="ltr" autocomplete="current-password" required minlength="6"></label>
        <label class="signup-name" hidden>تأكيد كلمة المرور <input name="password2" type="password" dir="ltr" autocomplete="new-password" minlength="6"></label>
        <p class="muted small signup-name" hidden>اسمك الظاهر سيكون اسم المستخدم، وتستطيع تغييره لاحقًا من ملفي.</p>
        <div class="first-only" dir="ltr" lang="en" hidden>
          <p class="hint">👑 You're the first one here, so you'll be the <b>admin</b>. To let the site save players and puzzles into your GitHub repo, paste a GitHub key once.</p>
          <label>GitHub key <input name="token" type="password" autocomplete="off" placeholder="github_pat_…"></label>
          <details class="small">
            <summary>How do I get a GitHub key?</summary>
            <ol class="small key-steps"></ol>
          </details>
        </div>
        <p class="error" hidden></p>
        <button type="submit" class="primary">تسجيل الدخول</button>
      </form>
      <p class="muted small signup-only" hidden>بعد التسجيل يصل طلبك إلى المشرف، وتستطيع اللعب بعد أن يفعّل حسابك.</p>
    </section>
  </template>

  <template id="t-code">
    <section class="card narrow">
      <h2 id="c-title"></h2>
      <p id="c-text"></p>
      <p class="muted small" id="c-after"></p>
      <button class="link" id="c-back"></button>
    </section>
  </template>

  <template id="t-play">
    <section class="card">
      <div class="progress"><span id="p-count"></span><span class="jewels" id="p-jewels" title="جواهرك"></span></div>
      <div class="dots" id="p-dots" aria-hidden="true"></div>
      <div id="puzzle">
        <p class="muted small" id="p-author"></p>
        <h2 id="p-question"></h2>
        <img id="p-image" alt="صورة اللغز" hidden>
        <form id="answer-form">
          <div id="p-options" class="options"></div>
          <input id="p-text" name="answer" placeholder="إجابتك" autocomplete="off" hidden>
          <p id="p-feedback" class="feedback" hidden></p>
          <img id="p-answer-image" alt="صورة الإجابة" hidden>
          <div class="row">
            <button type="submit" class="primary" id="p-submit">تحقق من الإجابة</button>
            <button type="button" id="p-postpone">⏭️ أجّل (١ 💎)</button>
            <button type="button" id="p-skip" class="link">تخطَّ</button>
          </div>
          <div id="p-hints" class="hints"></div>
        </form>
        <button class="primary" id="p-next" hidden>اللغز التالي ←</button>
      </div>
      <div id="done" class="center" hidden>
        <h2>🎉 أنهيت كل الألغاز!</h2>
        <p id="done-score"></p>
        <p class="jewels big" id="done-jewels"></p>
        <p>انتظر ألغازًا جديدة، فهي تظهر هنا بعد موافقة المشرف.</p>
        <p><a class="button primary" href="#submit">أضف لغزًا من عندك</a></p>
      </div>
    </section>
    <p class="muted small center" id="save-note">يُحفظ تقدمك على هذا الجهاز.</p>
  </template>

  <template id="t-submit">
    <section class="card">
      <h2 id="s-title">أضف لغزًا</h2>
      <p class="muted small" id="s-intro">أرسل لغزك، وسيظهر في اللعبة بعد موافقة المشرف. تحصل على جوهرة هدية لكل لغز يُقبل.</p>
      <form id="submit-form">
        <label>السؤال <textarea name="question" rows="3" required maxlength="1000"></textarea></label>
        <fieldset>
          <legend>نوع الإجابة</legend>
          <label class="inline"><input type="radio" name="type" value="text" checked> إجابة مكتوبة</label>
          <label class="inline"><input type="radio" name="type" value="choice"> اختيار من متعدد</label>
          <label class="inline"><input type="radio" name="type" value="photo"> رتّب الصورة</label>
          <label class="inline admin-only" hidden><input type="radio" name="type" value="word"> خمّن الكلمة (للمشرف)</label>
        </fieldset>
        <div id="s-options" hidden>
          <p class="small">الخيارات الأربعة (كلها مطلوبة):</p>
          <input name="opt" placeholder="الخيار ١" maxlength="200">
          <input name="opt" placeholder="الخيار ٢" maxlength="200">
          <input name="opt" placeholder="الخيار ٣" maxlength="200">
          <input name="opt" placeholder="الخيار ٤" maxlength="200">
          <p class="muted small">اكتب في "الإجابة الصحيحة" الخيار الصحيح كما هو. اللاعب يحصل على ٢ 💎 إذا أصاب من أول محاولة، و١ 💎 من الثانية.</p>
        </div>
        <div id="s-photo" hidden>
          <p class="small">ارفع صورة السؤال بالأسفل، وستُقطّع وتُخلط بنفس الترتيب لكل اللاعبين.</p>
          <label class="inline"><input type="radio" name="grid" value="2" checked> سهل: ٤ أجزاء (٢ 💎)</label>
          <label class="inline"><input type="radio" name="grid" value="3"> صعب: ٩ أجزاء (٣ 💎)</label>
        </div>
        <div id="s-word" hidden>
          <p class="small">تظهر للاعب كلمة عشوائية من القاموس بهذا العدد من الأحرف، وله ٦ محاولات. إذا لم يعرفها تبدأ له كلمة جديدة.</p>
          <label>عدد الأحرف
            <select name="wordLength">
              <option value="3">٣ أحرف (٢ 💎)</option>
              <option value="4">٤ أحرف (٣ 💎)</option>
              <option value="5" selected>٥ أحرف (٤ 💎)</option>
              <option value="6">٦ أحرف (٥ 💎)</option>
              <option value="7">٧ أحرف (٦ 💎)</option>
            </select>
          </label>
        </div>
        <div id="s-answers">
          <label>الإجابة الصحيحة <input name="answers" required placeholder="مثال: الرياض"></label>
          <div id="s-alts"></div>
          <button type="button" id="s-add-alt">➕ أضف إجابة بديلة</button>
          <p class="muted small">الإجابات البديلة تُقبل أيضًا (حتى ٥)، مثال: <b>كيبورد</b> و<b>لوحة المفاتيح</b>.<br>لا يهم الفرق بين (أ) و(ا)، ولا بين (ة) و(ه)، ولا وجود (ال) في أول الكلمة.</p>
        </div>
        <fieldset id="s-hints-box">
          <legend>التلميحات (اختياري، حتى ٤)</legend>
          <p class="muted small">التلميح الصغير يكلّف اللاعب جوهرتين، والكبير ٤ جواهر.</p>
          <div id="s-hints"></div>
          <button type="button" id="s-add-hint">➕ أضف تلميحًا</button>
        </fieldset>
        <div id="s-pictures">
        <label>صورة السؤال (اختياري) <input type="file" name="qImage" accept="image/*"></label>
        <img class="preview" id="s-q-preview" alt="" hidden>
        <label>صورة الإجابة، تظهر بعد الحل الصحيح (اختياري) <input type="file" name="aImage" accept="image/*"></label>
        <img class="preview" id="s-a-preview" alt="" hidden>
        </div>
        <p class="error" hidden></p>
        <button type="submit" class="primary">أرسل اللغز</button>
      </form>
    </section>
  </template>

  <template id="t-profile">
    <section class="card narrow">
      <h2>ملفي</h2>
      <dl class="facts">
        <dt>الاسم الظاهر</dt><dd id="pr-name"></dd>
        <dt>اسم المستخدم</dt><dd id="pr-username" dir="ltr"></dd>
        <dt>تاريخ الانضمام</dt><dd id="pr-joined"></dd>
        <dt>الجواهر</dt><dd id="pr-jewels"></dd>
        <dt>ألغاز حللتها</dt><dd id="pr-solved"></dd>
        <dt>ألغازي المقبولة في اللعبة</dt><dd id="pr-live"></dd>
        <dt>ألغازي بانتظار الموافقة</dt><dd id="pr-pending"></dd>
      </dl>
      <p class="muted small" id="pr-jewels-why"></p>
    </section>
    <section class="card narrow">
      <h2>غيّر اسمك الظاهر</h2>
      <form id="name-form">
        <label>الاسم الظاهر <input name="displayName" maxlength="40" required></label>
        <p class="muted small">يتغيّر اسمك على كل ألغازك أيضًا.</p>
        <p class="error" hidden></p>
        <p class="success" hidden></p>
        <button type="submit" class="primary">احفظ الاسم</button>
      </form>
    </section>
    <section class="card narrow">
      <h2>لوحة المتصدرين</h2>
      <label class="inline"><input type="checkbox" id="pr-anon"> أخفِ اسمي، وأظهر باسم "مجهول"</label>
      <p class="muted small" id="pr-anon-msg"></p>
      <label class="inline"><input type="checkbox" id="pr-hide"> لا تُظهرني في لوحة المتصدرين أبدًا</label>
      <p class="muted small" id="pr-hide-msg"></p>
    </section>
    <section class="card narrow">
      <h2>ألغازي</h2>
      <ul class="list" id="pr-puzzles"></ul>
    </section>
  </template>

  <template id="t-leaderboard">
    <section class="card narrow">
      <h2>🏆 المتصدرون</h2>
      <label lang="en" dir="ltr" class="small" id="board-group-box" hidden>Group (only you see this) <select id="board-group"></select></label>
      <p class="muted small">الترتيب حسب عدد الألغاز المحلولة، ثم الجواهر. ✅ ألغاز محلولة · 💎 جواهر · 🧩 ألغاز له في اللعبة</p>
      <ol class="board" id="board"><li class="muted">جارٍ التحميل…</li></ol>
      <p class="muted small" id="board-hidden" hidden></p>
      <p class="muted small">تريد إخفاء اسمك أو الخروج من اللوحة؟ من <a href="#profile">ملفي</a>.</p>
    </section>
  </template>

  <template id="t-admin-key">
    <section class="card narrow" dir="ltr" lang="en">
      <h2>Connect to GitHub</h2>
      <p>To save players and puzzles from this device, paste your GitHub key. It's saved only on this device.</p>
      <ol class="small key-steps"></ol>
      <form id="key-form">
        <label>GitHub key <input name="token" type="password" autocomplete="off" required placeholder="github_pat_…"></label>
        <p class="error" hidden></p>
        <button class="primary" type="submit">Save key</button>
      </form>
    </section>
  </template>

  <template id="t-admin">
    <section class="card" dir="ltr" lang="en">
      <div class="tabs">
        <button data-admin-tab="users" class="active">Users <span class="badge" id="signup-count"></span></button>
        <button data-admin-tab="pending">Pending <span class="badge" id="pending-count"></span></button>
        <button data-admin-tab="groups">Groups</button>
        <button data-admin-tab="puzzles">Puzzles</button>
        <button data-admin-tab="words">Word dictionary</button>
      </div>
      <p class="success" id="saved" hidden></p>
      <ul id="a-users" class="list"></ul>
      <ul id="a-pending" class="list" hidden></ul>
      <div id="a-groups" hidden>
        <p class="muted small">Each group has its own leaderboard, and players only see people from their own group. Puzzles by someone in another group show the maker as "Other Group User". Players never see group names. New players join the Default group; move them in the Users tab.</p>
        <form id="g-form" class="row">
          <input name="name" placeholder="New group name" maxlength="40" required autocomplete="off">
          <button type="submit" class="primary">Add group</button>
        </form>
        <ul id="g-list" class="list"></ul>
      </div>
      <ul id="a-puzzles" class="list" hidden></ul>
      <div id="a-words" hidden>
        <form id="w-form">
          <label>Add Arabic words (3 to 7 letters). Put several on separate lines or with spaces between them.
            <textarea name="words" rows="3" dir="rtl" lang="ar" required></textarea>
          </label>
          <button type="submit" class="primary">Add words</button>
          <p class="small" id="w-msg"></p>
        </form>
        <p class="muted small" id="w-counts"></p>
        <h3>Your words <span class="muted small" id="w-mine-count"></span></h3>
        <ul id="w-list" class="list"></ul>
      </div>
      <p class="muted small">Changes show on the site about a minute after saving.</p>
    </section>
    <section class="card" dir="ltr" lang="en">
      <h2>Storage</h2>
      <p class="muted small">GitHub suggests keeping each repo under about 1 GB. Sizes on GitHub can take a few hours to update.</p>
      <div class="meter"><div id="st-bar" style="width:0"></div></div>
      <p class="small" id="st-total">⏳ Checking…</p>
      <dl class="storage" id="st-list"></dl>
    </section>
    <section class="card" dir="ltr" lang="en">
      <h2>Saving progress</h2>
      <p class="muted small">Players' progress and jewels are saved in <code>usersSavedData.json</code> in a separate repo, using a key that can only change that repo. Setup steps are in the README.</p>
      <p class="small" id="saves-status"></p>
      <label>Saves repo <input id="saves-repo" value="SaudAlomari/sawg-saves" autocomplete="off"></label>
      <label>Saves key <input id="saves-key" type="password" autocomplete="off" placeholder="github_pat_… (only for the saves repo)"></label>
      <div class="row"><button id="saves-save">Save</button></div>
      <p><button id="forget" class="link">Remove GitHub key from this device</button></p>
      <p class="muted small">Site version 28</p>
    </section>
  </template>

  <script src="common.js?v=27"></script>
  <script src="saves.js?v=27"></script>
  <script src="admin.js?v=27"></script>
  <script src="app.js?v=27"></script>
</body>
</html>
